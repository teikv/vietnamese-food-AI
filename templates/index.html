<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vietnamese Food Recognition</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">
  <h1 class="text-3xl font-bold mb-6 text-gray-800">🍜 Vietnamese Food Recognition</h1>

  <form action="/predict" method="post" enctype="multipart/form-data" class="bg-white p-6 rounded-xl shadow-md w-96 text-center">
    <input type="file" name="file" class="block w-full text-sm text-gray-600 mb-4" accept="image/*" required>
    <button type="submit" class="bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600 transition">
      Upload & Predict
    </button>
  </form>

  {% if prediction %}
  <div class="mt-8 bg-white p-6 rounded-xl shadow-md w-96 text-center">
    <h2 class="text-2xl font-semibold mb-2">{{ prediction }}</h2>
    <p class="text-gray-600 mb-4">Độ chính xác: {{ confidence }}%</p>
    <p class="text-sm text-gray-700 mb-4">🍴 Thành phần: {{ ingredients }}</p>
    <img src="{{ image_path }}" class="w-full rounded-lg shadow" alt="Uploaded Image">
  </div>
  {% endif %}
</body>
</html>
